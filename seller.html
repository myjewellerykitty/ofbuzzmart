<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seller Portal | List Your Business & Catalogue</title>
  <style>
    :root {
      --bg-white: #ffffff;
      --bg-light: #f8fafc;
      --text-main: #000000;
      --text-muted: #4b5563;
      --navy-primary: #0f172a;
      --navy-accent: #1e3a8a;
      --border-color: #e2e8f0;
      --danger-red: #991b1b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg-white);
      color: var(--text-main);
      line-height: 1.5;
      overflow-x: hidden;
    }

    header {
      background-color: var(--navy-primary);
      color: #ffffff;
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .brand-logo {
      font-size: 1.4rem;
      font-weight: 800;
      color: #ffffff;
      text-decoration: none;
      white-space: nowrap;
    }

    .brand-logo span {
      color: #60a5fa;
    }

    nav {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    nav a {
      color: #ffffff;
      text-decoration: none;
      border: 1px solid #ffffff;
      padding: 0.45rem 0.85rem;
      border-radius: 4px;
      font-weight: 600;
      font-size: 0.9rem;
      white-space: nowrap;
      transition: background 0.2s;
    }

    nav a:hover, nav a.active {
      background-color: var(--navy-accent);
      border-color: var(--navy-accent);
    }

    .container {
      max-width: 800px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    .form-box {
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 2rem;
      background: var(--bg-white);
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.04);
    }

    .form-header {
      margin-bottom: 1.5rem;
    }

    .form-header h2 {
      font-size: 1.5rem;
      color: var(--navy-primary);
      margin-bottom: 0.25rem;
    }

    .form-header p {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.35rem;
      font-weight: 600;
      font-size: 0.95rem;
    }

    .form-group input, .form-group textarea {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 0.95rem;
      color: var(--text-main);
      background-color: #ffffff;
      transition: border-color 0.2s;
    }

    .form-group input:focus, .form-group textarea:focus {
      outline: none;
      border-color: var(--navy-accent);
      box-shadow: 0 0 0 2px rgba(30, 58, 138, 0.15);
    }

    /* Catalogue Repeater Section */
    .catalogue-wrapper {
      background: var(--bg-light);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 1.25rem;
      margin: 1.5rem 0;
    }

    .catalogue-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .catalogue-header h3 {
      font-size: 1.1rem;
      color: var(--navy-primary);
    }

    .catalogue-header span {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .product-row {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 1rem;
      margin-bottom: 0.75rem;
      display: grid;
      grid-template-columns: 2fr 1.5fr 2fr auto;
      gap: 0.5rem;
      align-items: center;
    }

    .product-row input {
      width: 100%;
      padding: 0.6rem 0.75rem;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      font-size: 0.9rem;
    }

    .product-row input:focus {
      outline: none;
      border-color: var(--navy-accent);
    }

    .btn-remove {
      background: #fee2e2;
      color: var(--danger-red);
      border: 1px solid #fecaca;
      padding: 0.55rem 0.8rem;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.9rem;
      transition: background 0.2s;
    }

    .btn-remove:hover {
      background: #fca5a5;
    }

    .btn-add-row {
      display: block;
      width: 100%;
      background: transparent;
      color: var(--navy-accent);
      border: 2px dashed var(--navy-accent);
      padding: 0.7rem;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: background 0.2s;
    }

    .btn-add-row:hover {
      background: #e0f2fe;
    }

    .btn-submit {
      display: block;
      width: 100%;
      background-color: var(--navy-primary);
      color: #ffffff;
      padding: 0.85rem;
      border: none;
      border-radius: 6px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 1.5rem;
    }

    .btn-submit:hover {
      background-color: var(--navy-accent);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    @media (max-width: 650px) {
      .product-row {
        grid-template-columns: 1fr;
        gap: 0.5rem;
      }

      .btn-remove {
        justify-self: start;
        width: 100%;
      }

      header {
        flex-direction: column;
        gap: 0.75rem;
        align-items: flex-start;
      }
      
      .form-box {
        padding: 1.25rem;
      }
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="brand-logo">Ofbuzz<span>Mart</span></a>
    <nav>
      <a href="index.html">Directory</a>
      <a href="seller.html" class="active">Seller Portal</a>
      <a href="Master.html">Master Panel</a>
    </nav>
  </header>

  <div class="container">
    <div class="form-box">
      <div class="form-header">
        <h2>List Your Business & Products</h2>
        <p>Register your company profile and build your multi-product catalogue for B2B buyers.</p>
      </div>

      <form id="sellerForm" onsubmit="handleSellerSubmit(event)">
        <div class="form-group">
          <label>Business / Company Name *</label>
          <input type="text" id="bizName" required placeholder="e.g. Royal Precision Tools">
        </div>

        <div class="form-group">
          <label>Business Category *</label>
          <input type="text" id="bizCategory" required placeholder="e.g. Industrial Machinery, Silver Wholesale, Electronics">
        </div>

        <div class="form-group">
          <label>Operating City & Address *</label>
          <input type="text" id="bizLocation" required placeholder="e.g. Gurugram, Delhi NCR">
        </div>

        <div class="form-group">
          <label>Contact Phone / WhatsApp *</label>
          <input type="tel" id="bizContact" required placeholder="+91 9811002233">
        </div>

        <div class="form-group">
          <label>Main Cover / Logo Image URL</label>
          <input type="url" id="bizImage" placeholder="https://images.unsplash.com/photo-...">
        </div>

        <div class="form-group">
          <label>Company Overview & Bio</label>
          <textarea id="bizAbout" rows="3" placeholder="Describe wholesale capabilities, minimum order quantities (MOQ), and services..."></textarea>
        </div>

        <!-- Dynamic Product Rows -->
        <div class="catalogue-wrapper">
          <div class="catalogue-header">
            <h3>Product & Service Catalogue</h3>
            <span>Add multiple products</span>
          </div>

          <div id="productContainer">
            <div class="product-row">
              <input type="text" placeholder="Product Title *" class="p-name" required>
              <input type="text" placeholder="Price (e.g. ₹1,200/unit)" class="p-price" required>
              <input type="url" placeholder="Product Image URL" class="p-img">
              <button type="button" class="btn-remove" onclick="removeRow(this)">✕</button>
            </div>
          </div>

          <button type="button" class="btn-add-row" onclick="addProductRow()">+ Add Another Product</button>
        </div>

        <button type="submit" id="submitBtn" class="btn-submit">Publish Business & Catalogue</button>
      </form>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxVqXTBxrODude9ddkHna4l-4vaNV6S1NCEL5XGatVR0Av5OF75_Yc3_Gy5Ej0KoSCj/exec";

    function addProductRow() {
      const container = document.getElementById("productContainer");
      const row = document.createElement("div");
      row.className = "product-row";
      row.innerHTML = `
        <input type="text" placeholder="Product Title *" class="p-name" required>
        <input type="text" placeholder="Price (e.g. ₹1,200/unit)" class="p-price" required>
        <input type="url" placeholder="Product Image URL" class="p-img">
        <button type="button" class="btn-remove" onclick="removeRow(this)">✕</button>
      `;
      container.appendChild(row);
    }

    function removeRow(btn) {
      const rows = document.querySelectorAll(".product-row");
      if (rows.length > 1) {
        btn.closest(".product-row").remove();
      } else {
        alert("At least one product item is required in your catalogue.");
      }
    }

    async function handleSellerSubmit(e) {
      e.preventDefault();
      const submitBtn = document.getElementById("submitBtn");
      submitBtn.innerText = "Submitting to Google Sheets...";
      submitBtn.disabled = true;

      const catalogue = [];
      document.querySelectorAll(".product-row").forEach(row => {
        const name = row.querySelector(".p-name").value.trim();
        const price = row.querySelector(".p-price").value.trim();
        const img = row.querySelector(".p-img").value.trim();
        if (name) {
          catalogue.push({
            name: name,
            price: price || "Quote on Request",
            img: img || "https://images.unsplash.com/photo-1504148455328-c376907d081c?auto=format&fit=crop&w=300&q=80"
          });
        }
      });

      const newEntry = {
        id: "ofb-" + Date.now(),
        name: document.getElementById("bizName").value.trim(),
        category: document.getElementById("bizCategory").value.trim(),
        location: document.getElementById("bizLocation").value.trim(),
        contact: document.getElementById("bizContact").value.trim(),
        image: document.getElementById("bizImage").value.trim() || "https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&w=600&q=80",
        about: document.getElementById("bizAbout").value.trim(),
        catalogue: catalogue
      };

      try {
        await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify({ action: "ADD_BUSINESS", data: newEntry })
        });

        alert("Business & Catalogue published successfully! Redirecting to directory...");
        document.getElementById("sellerForm").reset();
        window.location.href = "index.html";
      } catch (err) {
        alert("Failed to connect. Please verify your Google Sheet deployment.");
      } finally {
        submitBtn.innerText = "Publish Business & Catalogue";
        submitBtn.disabled = false;
      }
    }
  </script>
</body>
</html>

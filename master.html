<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Master Panel | OfbuzzMart Administration</title>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <style>
    :root {
      --bg-white: #ffffff;
      --bg-light: #f8fafc;
      --text-main: #000000;
      --text-muted: #4b5563;
      --navy-primary: #0f172a;
      --navy-accent: #1e3a8a;
      --border-color: #e2e8f0;
      --success-green: #047857;
      --danger-red: #991b1b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-white); color: var(--text-main); line-height: 1.5; overflow-x: hidden; }

    header {
      background-color: var(--navy-primary);
      color: #ffffff;
      padding: 1.25rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.08);
    }

    .brand-logo { font-size: 1.5rem; font-weight: 800; color: #ffffff; text-decoration: none; }
    .brand-logo span { color: #60a5fa; }

    nav a {
      color: #ffffff;
      text-decoration: none;
      background-color: var(--navy-accent);
      padding: 0.55rem 1.1rem;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .container { max-width: 1200px; margin: 2.5rem auto; padding: 0 1.5rem; }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .table-container {
      width: 100%;
      overflow-x: auto;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background: var(--bg-white);
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.04);
    }

    .data-table { width: 100%; border-collapse: collapse; min-width: 900px; }
    .data-table th, .data-table td {
      padding: 1rem; text-align: left; font-size: 0.92rem; border-bottom: 1px solid var(--border-color); vertical-align: middle;
    }
    .data-table th { background-color: var(--navy-primary); color: #ffffff; font-weight: 600; }

    .btn-actions { display: flex; gap: 0.4rem; flex-wrap: wrap; }
    .action-btn {
      padding: 0.45rem 0.75rem; font-size: 0.8rem; border-radius: 4px; cursor: pointer; border: 1px solid transparent; font-weight: 600;
    }
    .btn-verify { background-color: #e0f2fe; color: #0369a1; border-color: #bae6fd; }
    .btn-sponsor { background-color: #d1fae5; color: var(--success-green); border-color: #a7f3d0; }
    .btn-ad { background-color: #fef08a; color: #854d0e; border-color: #fde047; }
    .btn-delete { background-color: #fee2e2; color: var(--danger-red); border-color: #fecaca; }

    .badge-status { padding: 0.25rem 0.6rem; border-radius: 4px; font-size: 0.75rem; font-weight: 700; white-space: nowrap; display: inline-block; }
    .status-verified { background: #e0f2fe; color: #0369a1; }
    .status-pending { background: #f3f4f6; color: var(--text-muted); }
    .status-sponsor { background: #d1fae5; color: var(--success-green); }
    .status-standard { background: #f3f4f6; color: var(--text-muted); }

    .loader { text-align: center; padding: 4rem; color: var(--navy-accent); font-weight: 600; font-size: 1.1rem; }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="brand-logo">Ofbuzz<span>Mart</span></a>
    <nav><a href="index.html">View Directory</a></nav>
  </header>

  <div class="container">
    <div class="panel-header">
      <div>
        <h2>Master Control & Moderation</h2>
        <p>Verify listings, toggle top rank, or run <strong>₹50/day Ad Promotion</strong> to pin businesses as #1.</p>
      </div>
      <button class="action-btn" onclick="loadData()" style="background:var(--navy-primary); color:#fff; padding:0.6rem 1.2rem;">⟳ Refresh Data</button>
    </div>

    <div id="loader" class="loader">Loading all entries from Google Sheets...</div>

    <div class="table-container" id="tableContainer" style="display: none;">
      <table class="data-table">
        <thead>
          <tr>
            <th>Company & Category</th>
            <th>Contact & Email</th>
            <th>Reg Fee (₹99)</th>
            <th>Ad Promotion (₹50/day)</th>
            <th>Sponsorship (#1 Rank)</th>
            <th>Moderation Actions</th>
          </tr>
        </thead>
        <tbody id="adminTableBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxVqXTBxrODude9ddkHna4l-4vaNV6S1NCEL5XGatVR0Av5OF75_Yc3_Gy5Ej0KoSCj/exec";
    const RAZORPAY_KEY = "rzp_test_TUnU94hn43c7rQ";
    let businesses = [];

    function loadData() {
      const loader = document.getElementById("loader");
      const tableContainer = document.getElementById("tableContainer");
      loader.style.display = "block";
      tableContainer.style.display = "none";

      const script = document.createElement("script");
      const callbackName = "handleMasterData_" + Date.now();
      
      window[callbackName] = function(data) {
        businesses = Array.isArray(data) ? data : [];
        loader.style.display = "none";
        tableContainer.style.display = "block";
        renderTable();
        delete window[callbackName];
        script.remove();
      };

      script.src = `${SCRIPT_URL}?callback=${callbackName}`;
      document.body.appendChild(script);
    }

    function renderTable() {
      const tbody = document.getElementById("adminTableBody");
      tbody.innerHTML = "";

      if (!businesses.length) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding: 3rem; color: var(--text-muted);">No businesses found.</td></tr>`;
        return;
      }

      businesses.forEach(b => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>
            <strong>${b.name || "Untitled"}</strong><br>
            <span style="font-size: 0.8rem; color: var(--text-muted);">${b.category || "General"}</span>
          </td>
          <td>
            📞 ${b.contact || "N/A"}<br>
            <span style="font-size: 0.75rem; color: var(--text-muted);">${b.email || "No email"}</span>
          </td>
          <td>
            <span class="badge-status ${b.paidReg ? 'status-verified' : 'status-pending'}">
              ${b.paidReg ? '✓ Paid (₹99)' : 'Unpaid'}
            </span>
          </td>
          <td>
            <strong>${b.adDays || 0} Days Active</strong><br>
            <button class="action-btn btn-ad" onclick="runAdPromotion('${b.id}', '${b.name}')" style="margin-top:4px;">Run Ad (₹50/day)</button>
          </td>
          <td>
            <span class="badge-status ${b.isSponsored ? 'status-sponsor' : 'status-standard'}">
              ${b.isSponsored ? '★ #1 Top Sponsor' : 'Standard'}
            </span>
          </td>
          <td>
            <div class="btn-actions">
              <button class="action-btn btn-verify" onclick="toggleVerification('${b.id}')">
                ${b.isVerified ? 'Unverify' : 'Verify'}
              </button>
              <button class="action-btn btn-sponsor" onclick="toggleSponsorDirect('${b.id}')">
                ${b.isSponsored ? 'Remove #1' : 'Pin #1'}
              </button>
              <button class="action-btn btn-delete" onclick="deleteBusiness('${b.id}')">
                Delete
              </button>
            </div>
          </td>
        `;
        tbody.appendChild(row);
      });
    }

    // ₹50/DAY AD PROMOTION RAZORPAY CHECKOUT
    function runAdPromotion(businessId, bizName) {
      const daysInput = prompt(`Enter number of days to run the #1 Ad Promotion for ${bizName} (₹50 per day):`, "7");
      if (!daysInput || isNaN(daysInput) || Number(daysInput) <= 0) return;
      const days = Number(daysInput);
      const totalAmount = days * 50 * 100; // in paise

      const options = {
        key: RAZORPAY_KEY,
        amount: totalAmount,
        currency: "INR",
        name: "OfbuzzMart Ads",
        description: `Ad Promotion for ${days} Days (#1 Rank)`,
        handler: async function (response) {
          alert(`Ad Payment Successful! ID: ${response.razorpay_payment_id}`);
          await updateAdDaysInSheet(businessId, days);
        },
        theme: { color: "#0f172a" }
      };

      if (RAZORPAY_KEY === "rzp_test_TUnU94hn43c7rQ") {
        if (confirm(`Test Mode: Simulate ₹${days * 50} payment for ${days} days ad promotion?`)) {
          updateAdDaysInSheet(businessId, days);
        }
        return;
      }

      const rzp = new Razorpay(options);
      rzp.open();
    }

    async function updateAdDaysInSheet(id, days) {
      await fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({ action: "UPDATE_AD_DAYS", id: id, days: days })
      });
      setTimeout(loadData, 1500);
    }

    async function toggleVerification(id) {
      await fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({ action: "TOGGLE_VERIFY", id: id })
      });
      setTimeout(loadData, 1500);
    }

    async function toggleSponsorDirect(id) {
      await fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({ action: "UPGRADE_SPONSOR", id: id })
      });
      setTimeout(loadData, 1500);
    }

    async function deleteBusiness(id) {
      if (confirm("Delete this listing permanently?")) {
        await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify({ action: "DELETE_BUSINESS", id: id })
        });
        setTimeout(loadData, 1500);
      }
    }

    loadData();
  </script>
</body>
</html>

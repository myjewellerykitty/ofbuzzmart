<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Master Console | OfbuzzMart Admin</title>
  <!-- Razorpay Checkout Integration -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <style>
    :root {
      --bg-white: #ffffff;
      --bg-light: #f8fafc;
      --text-main: #000000;
      --text-muted: #4b5563;
      --navy-primary: #0f172a;
      --navy-accent: #1e3a8a;
      --border-color: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-white);
      color: var(--text-main);
      line-height: 1.5;
    }

    header {
      background-color: var(--navy-primary);
      color: #ffffff;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand-logo {
      font-size: 1.5rem;
      font-weight: 800;
      color: #ffffff;
      text-decoration: none;
    }

    .brand-logo span {
      color: #60a5fa;
    }

    nav a {
      color: #ffffff;
      text-decoration: none;
      border: 1px solid #ffffff;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      font-weight: 600;
      margin-left: 0.5rem;
    }

    nav a:hover, nav a.active {
      background-color: var(--navy-accent);
      border-color: var(--navy-accent);
    }

    .container {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1.5rem;
    }

    .data-table th, .data-table td {
      border: 1px solid var(--border-color);
      padding: 0.75rem 1rem;
      text-align: left;
      font-size: 0.95rem;
    }

    .data-table th {
      background-color: var(--navy-primary);
      color: #ffffff;
    }

    .action-btn {
      padding: 0.35rem 0.7rem;
      font-size: 0.8rem;
      margin-right: 0.25rem;
      border-radius: 3px;
      cursor: pointer;
      border: none;
      background: var(--navy-accent);
      color: #fff;
    }

    .action-btn.delete {
      background: #991b1b;
    }

    .loader {
      text-align: center;
      padding: 2rem;
      color: var(--navy-accent);
      font-weight: 600;
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="brand-logo">Ofbuzz<span>Mart</span></a>
    <nav>
      <a href="index.html">Directory</a>
      <a href="seller.html">Seller Portal</a>
      <a href="Master.html" class="active">Master Admin</a>
    </nav>
  </header>

  <div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h2 style="color: var(--navy-primary);">Master Control & Moderation</h2>
      <span style="font-size: 0.9rem; color: var(--text-muted);">Sponsor Upgrade: ₹99 via Razorpay</span>
    </div>

    <div id="loader" class="loader">Loading entries from Google Sheets...</div>

    <table class="data-table" id="adminTable" style="display: none;">
      <thead>
        <tr>
          <th>Business Name</th>
          <th>Category</th>
          <th>Location</th>
          <th>Verification</th>
          <th>Sponsorship (Top Pin)</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="adminTableBody"></tbody>
    </table>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxVqXTBxrODude9ddkHna4l-4vaNV6S1NCEL5XGatVR0Av5OF75_Yc3_Gy5Ej0KoSCj/exec";
    const RAZORPAY_KEY = "YOUR_RAZORPAY_KEY_ID"; // Replace with your active Razorpay Key ID
    let businesses = [];

    async function loadData() {
      const loader = document.getElementById("loader");
      const table = document.getElementById("adminTable");
      try {
        const res = await fetch(SCRIPT_URL);
        businesses = await res.json();
        loader.style.display = "none";
        table.style.display = "table";
        renderTable();
      } catch (err) {
        loader.innerText = "Error loading admin data.";
      }
    }

    function renderTable() {
      const tbody = document.getElementById("adminTableBody");
      tbody.innerHTML = "";

      businesses.forEach(b => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td><strong>${b.name}</strong></td>
          <td>${b.category}</td>
          <td>${b.location}</td>
          <td>${b.isVerified ? "✅ Verified" : "⏳ Pending"}</td>
          <td>
            ${b.isSponsored 
              ? `<span style="color: green; font-weight: bold;">Sponsored (Top)</span>` 
              : `<button class="action-btn" onclick="initiateRazorpayPayment('${b.id}')">Pay ₹99 Sponsor</button>`}
          </td>
          <td>
            <button class="action-btn" onclick="toggleVerification('${b.id}')">${b.isVerified ? 'Unverify' : 'Verify'}</button>
            <button class="action-btn delete" onclick="deleteBusiness('${b.id}')">Delete</button>
          </td>
        `;
        tbody.appendChild(row);
      });
    }

    async function toggleVerification(id) {
      await fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "TOGGLE_VERIFY", id: id })
      });
      setTimeout(loadData, 1500);
    }

    async function deleteBusiness(id) {
      if (confirm("Delete this listing from Google Sheets database?")) {
        await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: "DELETE_BUSINESS", id: id })
        });
        setTimeout(loadData, 1500);
      }
    }

    function initiateRazorpayPayment(businessId) {
      const business = businesses.find(b => b.id === businessId);
      if (!business) return;

      const options = {
        key: RAZORPAY_KEY,
        amount: 9900, // ₹99 in paise
        currency: "INR",
        name: "OfbuzzMart",
        description: `Top Placement for ${business.name}`,
        handler: async function (response) {
          alert(`Payment complete (ID: ${response.razorpay_payment_id}). Pinning to top...`);
          await fetch(SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ action: "UPGRADE_SPONSOR", id: businessId })
          });
          setTimeout(loadData, 1500);
        },
        prefill: {
          name: business.name,
          contact: business.contact
        },
        theme: {
          color: "#0f172a"
        }
      };

      if (RAZORPAY_KEY === "YOUR_RAZORPAY_KEY_ID") {
        if (confirm("Demo mode: Simulate ₹99 payment and pin to top in Google Sheets?")) {
          fetch(SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ action: "UPGRADE_SPONSOR", id: businessId })
          }).then(() => setTimeout(loadData, 1500));
        }
        return;
      }

      const rzp = new Razorpay(options);
      rzp.open();
    }

    loadData();
  </script>
</body>
</html>
